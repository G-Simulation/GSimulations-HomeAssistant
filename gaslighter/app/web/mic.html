<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141a">
<meta name="mobile-web-app-capable" content="yes">
<title>GLighter – Mikrofon</title>
<style>
:root{--bg:#10141a;--card:#1a2029;--tx:#e6e8eb;--mut:#98a2ad;--bd:#2a313b;--acc:#4dabf7;--thr:#ff922b;--red:#ff6b6b;--ok:#51cf66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
#go{width:180px;height:180px;border-radius:50%;border:0;margin:6px auto;display:block;font:700 22px system-ui;color:#fff;background:var(--acc);box-shadow:0 0 0 8px #4dabf722;cursor:pointer;touch-action:manipulation}
#go.on{background:var(--red);box-shadow:0 0 0 8px #ff6b6b22}
#go:disabled{opacity:.5}
.st{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:#868e96}
.dot.ok{background:var(--ok)}.dot.ev{background:var(--red);animation:b 1s infinite}.dot.err{background:var(--thr)}
@keyframes b{50%{opacity:.4}}
.meter{position:relative;height:26px;background:#0b0f14;border-radius:8px;overflow:hidden;margin-top:10px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f9e44,#fab005,#e03131);width:0}
.meter b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--thr);display:none}
.nums{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px;font-variant-numeric:tabular-nums}
.tips{font-size:14px;color:var(--mut)}.tips li{margin:4px 0}
.warn{background:#ff922b1f;border:1px solid var(--thr);border-radius:12px;padding:10px 12px;font-size:14px;display:none}
.small{font-size:12px;color:var(--mut);text-align:center}
.mot{display:none}.mot h2{font-size:15px;margin:0 0 8px}.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.mrow b{font-variant-numeric:tabular-nums}.mrow .on{color:var(--red);font-weight:700}
#camv{width:100%;max-height:180px;border-radius:10px;background:#000;object-fit:cover;display:none;margin-top:6px}
.mhint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div><h1 id="title">GLighter</h1><div class="sub" id="srcname">…</div></div>
  <div class="warn" id="warn"></div>
  <div class="card">
    <button id="go">Start</button>
    <div class="st"><span class="dot" id="dot"></span><span id="state">Bereit</span></div>
    <div class="meter"><i id="bar"></i><b id="thr"></b></div>
    <div class="nums"><span id="lvl">– dBFS</span><span id="thrv"></span><span id="sent"></span></div>
  </div>
  <div class="card mot" id="mot"><h2 id="mott"></h2>
    <div class="mrow" id="mvr"><span id="mvl"></span><b id="mvv">–</b></div>
    <div class="mrow" id="mtr"><span id="mtl"></span><b id="mtv">–</b></div>
    <div class="mrow" id="mcr"><span id="mcl"></span><b id="mcv">–</b></div>
    <video id="camv" muted playsinline></video>
    <div class="mhint" id="mhint"></div></div>
  <div class="card tips"><ul id="tips"></ul></div>
  <div class="small">v{{VERSION}} · <span id="wl"></span></div>
</div>
<script>
(function () {
'use strict';
const T = {
  de: { start: 'Start', stop: 'Stopp', ready: 'Bereit', connecting: 'Verbinde …', live: 'Sendet', event: 'Störung erkannt', offline: 'Keine Verbindung – versuche erneut …',
    disabled: 'Quelle ist im GLighter ausgeschaltet', paused: 'Aufzeichnung angehalten – Ton wird nicht ausgewertet', hold: 'Angehalten durch Home Assistant', learning: 'Lernt Hintergrund …', denied: 'Mikrofon-Zugriff verweigert. Erlaube das Mikrofon in den Browser-Einstellungen für diese Seite.',
    insecure: 'Diese Seite muss über https:// geöffnet werden, sonst gibt der Browser das Mikrofon nicht frei.',
    hidden: 'Seite war im Hintergrund – Aufnahme läuft weiter, sobald sie wieder sichtbar ist. Bildschirm anlassen!',
    nolink: 'Ungültiger oder erneuerter Link. Öffne den QR-Code im GLighter neu.', busy: 'Dieser Link wird gerade auf einem anderen Gerät benutzt. Dort stoppen oder im GLighter eine eigene Quelle für dieses Handy anlegen.', thr: 'Schwelle', sent: 'gesendet', wlon: 'Bildschirm bleibt an', wloff: 'Bildschirm-Sperre nicht verhinderbar – bitte Display-Timeout verlängern',
    mot: 'Bewegungsmelder', mvib: '🫨 Erschütterung', mtilt: '📐 Neigung', mcam: '🏃 Bewegung im Bild', mon: 'ausgelöst', mhint: 'Ausgewertet wird nur hier auf dem Handy – es werden nur Zahlen gesendet, kein Bild und kein Video. Für Erschütterung das Handy flach auf Boden, Tisch oder an die Wand legen.',
    mden: 'Bewegungssensor nicht freigegeben – in den Browser-Einstellungen für diese Seite „Bewegung und Ausrichtung“ erlauben.', mcden: 'Kamera nicht freigegeben – Bewegung im Bild ist aus.', mnone: 'Dieses Handy hat keinen Bewegungssensor.',
    tips: ['Handy ans Ladegerät und an die Stelle legen, von der der Lärm kommt (z. B. an die Wand).', 'Diese Seite geöffnet lassen. Der Bildschirm bleibt automatisch an und wird nur gedimmt, wenn du die Helligkeit herunterregelst.',
      'Nicht sperren und nicht in eine andere App wechseln – Android schaltet das Mikrofon sonst ab.', 'Tipp: Chrome-Menü ⋮ → „Zum Startbildschirm hinzufügen“, dann startet die Seite wie eine App.',
      'Für Betrieb mit ausgeschaltetem Bildschirm: App „IP Webcam“ als Stream-Quelle verwenden (siehe GLighter → Einstellungen → Quellen).'] },
  en: { start: 'Start', stop: 'Stop', ready: 'Ready', connecting: 'Connecting …', live: 'Sending', event: 'Disturbance detected', offline: 'No connection – retrying …',
    disabled: 'This source is switched off in GLighter', paused: 'Recording paused – sound is not evaluated', hold: 'Paused by Home Assistant', learning: 'Learning background …', denied: 'Microphone access denied. Allow the microphone for this site in the browser settings.',
    insecure: 'This page must be opened via https://, otherwise the browser will not release the microphone.',
    hidden: 'Page was in the background – recording continues once it is visible again. Keep the screen on!',
    nolink: 'Invalid or renewed link. Open the QR code in GLighter again.', busy: 'This link is currently used on another device. Stop it there or create a separate source for this phone in GLighter.', thr: 'Threshold', sent: 'sent', wlon: 'Screen stays on', wloff: 'Cannot keep the screen on – please increase the display timeout',
    mot: 'Motion sensor', mvib: '🫨 Vibration', mtilt: '📐 Tilt', mcam: '🏃 Motion in picture', mon: 'triggered', mhint: 'Evaluated only here on the phone – only numbers are sent, no picture and no video. For vibration lay the phone flat on the floor, a table or against the wall.',
    mden: 'Motion sensor not allowed – allow “motion and orientation” for this site in the browser settings.', mcden: 'Camera not allowed – motion in picture is off.', mnone: 'This phone has no motion sensor.',
    tips: ['Put the phone on the charger at the spot where the noise comes from (e.g. against the wall).', 'Keep this page open. The screen stays on automatically.',
      'Do not lock the phone or switch apps – Android would turn the microphone off.', 'Tip: Chrome menu ⋮ → "Add to Home screen" to start the page like an app.',
      'For screen-off operation use the app "IP Webcam" as a stream source (see GLighter → Settings → Sources).'] }
};
let L = (navigator.language || 'de').toLowerCase().startsWith('de') ? T.de : T.en;
const $ = id => document.getElementById(id);
const m = location.pathname.match(/\/m\/([0-9a-f]{32})/);
const BASE = m ? '/m/' + m[1] : null;
const RATE = 16000, CHUNK_MS = 200;
let ctx = null, stream = null, node = null, src = null, running = false, wakeLock = null;
let acc = new Float32Array(0), queue = [], seq = 0, sending = false, sentBytes = 0, lastOk = 0, failCount = 0;
const sid = Math.random().toString(16).slice(2) + Date.now().toString(16);
let devModel = '', devPv = '';
try { if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']).then(v => { devModel = (v.model || '').slice(0, 40); devPv = (v.platformVersion || '').split('.').slice(0, 2).join('.'); }).catch(() => { }); } catch (e) { }
let MOT = { vib: false, cam: false, tilt: false }, lastT = 0, curT = 0, tG = null, tB = null, tN = 0, curV = 0, curC = 0, lastV = 0, lastC = 0, srvMot = {}, camStream = null, camTimer = 0, motOn = false, gx = 0, gy = 0, gz = 0;
let srvThr = null, srvActive = false, srvLearning = false, srvEnabled = true, srvPaused = false, srvHold = null, localDb = -120;

function tr() {
  $('go').textContent = running ? L.stop : L.start;
  $('mot').style.display = MOT.vib || MOT.cam || MOT.tilt ? 'block' : 'none'; $('mvr').style.display = MOT.vib ? 'flex' : 'none'; $('mtr').style.display = MOT.tilt ? 'flex' : 'none'; $('mcr').style.display = MOT.cam ? 'flex' : 'none';
  $('mott').textContent = L.mot; $('mvl').textContent = L.mvib; $('mtl').textContent = L.mtilt; $('mcl').textContent = L.mcam; if (!$('mhint').dataset.err) $('mhint').textContent = L.mhint;
  $('tips').innerHTML = L.tips.map(s => '<li>' + s.replace(/</g, '&lt;') + '</li>').join('');
}
function warn(msg) { const w = $('warn'); w.style.display = msg ? 'block' : 'none'; w.textContent = msg || ''; }
function setState(txt, cls) { $('state').textContent = txt; $('dot').className = 'dot' + (cls ? ' ' + cls : ''); }

async function info() {
  if (!BASE) { warn(L.nolink); $('go').disabled = true; return; }
  try {
    const j = await (await fetch(BASE + '/info', { cache: 'no-store' })).json();
    if (j.lang === 'en') L = T.en; else if (j.lang === 'de') L = T.de;
    $('srcname').textContent = j.name; document.title = j.name + ' – GLighter';
    if (j.motion) MOT = { vib: !!j.motion.vib, cam: !!j.motion.cam, tilt: !!j.motion.tilt };
    tr();
  } catch (e) { warn(L.nolink); }
}

/* Audio: Float32 beliebiger Rate -> 16 kHz Int16 (gebrochene Leseposition, kein Drift) */
let inBuf = new Float32Array(0), pos = 0;
function onAudio(f32) {
  const ratio = ctx.sampleRate / RATE;
  let part;
  if (ratio === 1) part = f32;
  else {
    const joined = new Float32Array(inBuf.length + f32.length); joined.set(inBuf); joined.set(f32, inBuf.length);
    const out = [];
    while (pos + ratio <= joined.length) {          // Mittelwert ueber das Quellintervall (einfacher Tiefpass)
      const a = Math.floor(pos), b = Math.max(a + 1, Math.floor(pos + ratio));
      let s = 0; for (let k = a; k < b; k++) s += joined[k];
      out.push(s / (b - a)); pos += ratio;
    }
    const used = Math.floor(pos); inBuf = joined.slice(used); pos -= used;
    part = Float32Array.from(out);
  }
  const a2 = new Float32Array(acc.length + part.length); a2.set(acc); a2.set(part, acc.length); acc = a2;
  const need = RATE * CHUNK_MS / 1000;
  while (acc.length >= need) {
    const c = acc.subarray(0, need), pcm = new Int16Array(need); let sq = 0;
    for (let i = 0; i < need; i++) { const v = Math.max(-1, Math.min(1, c[i])); pcm[i] = v < 0 ? v * 32768 : v * 32767; sq += v * v; }
    localDb = 10 * Math.log10(sq / need + 1e-12);
    queue.push({ seq: seq++, buf: pcm.buffer, t: Date.now(), mv: MOT.vib && motOn ? curV : null, mc: MOT.cam && camStream ? curC : null, mt: MOT.tilt && tB ? curT : null }); lastT = curT; curT = 0; lastV = curV; lastC = curC; curV = 0; curC = 0;
    if (queue.length > 900) queue.splice(0, queue.length - 900);       // hoechstens 3 min puffern (Update, WLAN weg); nur im Arbeitsspeicher
    acc = acc.slice(need);
  }
  send();
}
let sentLast = -1, dead = false;
/* Einpegeln: dieses Handy spielt auf Anforderung gleichmäßiges Rauschen (Testgeräusch) */
let toneSrc = null;
function pinkBuf(c) {
  const n = c.sampleRate * 4, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1;
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926; }
  return b;
}
function toneSet(on) {
  if (!ctx) return;
  if (on && !toneSrc) { try { const g = ctx.createGain(); g.gain.value = 0.8; toneSrc = ctx.createBufferSource(); toneSrc.buffer = pinkBuf(ctx); toneSrc.loop = true; toneSrc.connect(g); g.connect(ctx.destination); toneSrc.start(); } catch (e) { toneSrc = null; } }
  else if (!on && toneSrc) { try { toneSrc.stop(); } catch (e) { } toneSrc = null; }
}
let pushAC = null, sendT0 = 0;                       // ab 1.85.53: laufende Übertragung (zum Abbrechen), Beginn
async function send() {
  if (sending || !queue.length || dead) return;
  sending = true; sendT0 = Date.now();
  while (queue.length && running && !dead) {
    // bis zu 1 s auf einmal senden, beim Nachholen bis zu 5 s (spart Anfragen nach Verbindungsabbruch)
    const n = Math.min(queue.length, queue.length > 25 ? 25 : 5), parts = queue.slice(0, n), len = parts.reduce((s, p) => s + p.buf.byteLength, 0);
    const body = new Uint8Array(len); let o = 0; for (const p of parts) { body.set(new Uint8Array(p.buf), o); o += p.buf.byteLength; }
    const last = parts[n - 1];
    try {
      sendT0 = Date.now(); pushAC = new AbortController(); const tmo = setTimeout(() => pushAC.abort(), 8000);   // haengt die Verbindung (WLAN-Wechsel, Server kurz weg): nach 8 s abbrechen und neu – vorher wartete die Seite minutenlang und schickte dann alles in Schueben
      let r;
      try {
        r = await fetch(BASE + '/push?sid=' + sid + '&first=' + parts[0].seq + '&seq=' + last.seq + '&age=' + Math.max(0, Date.now() - last.t) + '&ct=' + Date.now() + (devModel ? '&dev=' + encodeURIComponent(devModel) : '') + (devPv ? '&pv=' + encodeURIComponent(devPv) : '') + motParams(parts),
          { method: 'POST', body, headers: { 'Content-Type': 'application/octet-stream' }, cache: 'no-store', signal: pushAC.signal });
      } finally { clearTimeout(tmo); pushAC = null; }
      if (r.status === 404) { dead = true; warn(L.nolink); setState(L.nolink, 'err'); stop(true); break; }
      if (r.status === 409) { warn(L.busy); setState(L.busy, 'err'); await new Promise(res => setTimeout(res, 5000)); continue; }
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      sentLast = last.seq; queue = queue.filter(p => p.seq > sentLast);
      sentBytes += len; lastOk = Date.now(); failCount = 0;
      toneSet(!!j.tone);
      srvThr = j.thr; srvActive = !!j.active; srvLearning = !!j.learning; srvEnabled = j.enabled !== false; srvPaused = !!j.paused; srvHold = j.hold || null; srvMot = j.motion || {};
    } catch (e) {
      failCount++; setState(L.offline, 'err');
      await new Promise(res => setTimeout(res, Math.min(5000, 500 * failCount)));
    }
  }
  sending = false;
}
setInterval(() => {                                   // Waechter: Senden anstossen, wenn Ton wartet und nichts laeuft; eine seit >20 s haengende Uebertragung abbrechen
  if (!running || dead) return;
  if (sending && pushAC && Date.now() - sendT0 > 20000) { try { pushAC.abort(); } catch (e) { } }
  if (!sending && queue.length) send();
}, 2000);

/* Bewegungsmelder: Erschütterung (Beschleunigung ohne Schwerkraft) und Bewegung im Kamerabild – nur hier ausgewertet */
function motParams(parts) {
  let v = null, c = null;
  let tt = null; for (const p of parts) { if (p.mv != null) v = Math.max(v || 0, p.mv); if (p.mc != null) c = Math.max(c || 0, p.mc); if (p.mt != null) tt = Math.max(tt || 0, p.mt); }
  return (v != null ? '&mv=' + v.toFixed(4) : '') + (c != null ? '&mc=' + c.toFixed(2) : '') + (tt != null ? '&mt=' + tt.toFixed(1) : '');
}
function onMotion(e) {
  let x, y, z; const a = e.acceleration;
  if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
  else { const g = e.accelerationIncludingGravity; if (!g || g.x == null) return; gx = 0.92 * gx + 0.08 * g.x; gy = 0.92 * gy + 0.08 * g.y; gz = 0.92 * gz + 0.08 * g.z; x = g.x - gx; y = g.y - gy; z = g.z - gz; }
  const m = Math.sqrt(x * x + y * y + z * z); if (isFinite(m)) curV = Math.max(curV, m); motOn = true;
  const G = e.accelerationIncludingGravity;                      // Neigung: Lage gegenüber der Ruhelage (erste Sekunden)
  if (MOT.tilt && G && G.x != null) {
    tG = tG ? [0.97 * tG[0] + 0.03 * G.x, 0.97 * tG[1] + 0.03 * G.y, 0.97 * tG[2] + 0.03 * G.z] : [G.x, G.y, G.z]; tN++;
    if (!tB && tN > 120) tB = tG.slice();
    if (tB) { const na = Math.hypot(...tG), nb = Math.hypot(...tB); if (na > 1 && nb > 1) { const c = Math.max(-1, Math.min(1, (tG[0] * tB[0] + tG[1] * tB[1] + tG[2] * tB[2]) / (na * nb))); curT = Math.max(curT, Math.acos(c) * 180 / Math.PI); } }
  }
}
async function motStart() {
  if (MOT.vib || MOT.tilt) {
    try {
      if (typeof DeviceMotionEvent === 'undefined') throw new Error('none');
      if (typeof DeviceMotionEvent.requestPermission === 'function' && await DeviceMotionEvent.requestPermission() !== 'granted') throw new Error('denied');
      window.addEventListener('devicemotion', onMotion);
      setTimeout(() => { if (!motOn && running) { $('mhint').dataset.err = 1; $('mhint').textContent = L.mnone; } }, 4000);
    } catch (e) { $('mhint').dataset.err = 1; $('mhint').textContent = e.message === 'none' ? L.mnone : L.mden; }
  }
  if (MOT.cam) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 10, max: 15 } }, audio: false });
      const v = $('camv'); v.srcObject = camStream; v.style.display = 'block'; await v.play().catch(() => { });
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 48; const g = cv.getContext('2d', { willReadFrequently: true });
      let prev = null;
      camTimer = setInterval(() => {
        if (!v.videoWidth) return;
        g.drawImage(v, 0, 0, 64, 48); const d = g.getImageData(0, 0, 64, 48).data, n = 64 * 48, cur = new Uint8Array(n);
        for (let i = 0; i < n; i++) cur[i] = (d[4 * i] * 3 + d[4 * i + 1] * 6 + d[4 * i + 2]) / 10;
        if (prev) {
          let sh = 0; for (let i = 0; i < n; i++) sh += cur[i] - prev[i]; sh /= n;        // Helligkeit insgesamt (Licht an/aus) herausrechnen
          let k = 0; for (let i = 0; i < n; i++) if (Math.abs(cur[i] - prev[i] - sh) > 24) k++;
          curC = Math.max(curC, 100 * k / n);
        }
        prev = cur;
      }, 200);
    } catch (e) { camStream = null; $('mhint').dataset.err = 1; $('mhint').textContent = L.mcden; }
  }
}
function motStop() {
  window.removeEventListener('devicemotion', onMotion); motOn = false;
  clearInterval(camTimer); camTimer = 0;
  try { camStream && camStream.getTracks().forEach(t => t.stop()); } catch (e) { }
  camStream = null; $('camv').style.display = 'none';
}

const WORKLET = `class P extends AudioWorkletProcessor{constructor(){super();this.b=[];this.n=0}
process(i){const c=i[0]&&i[0][0];if(c){this.b.push(c.slice());this.n+=c.length;if(this.n>=2048){const o=new Float32Array(this.n);let k=0;for(const x of this.b){o.set(x,k);k+=x.length}this.port.postMessage(o,[o.buffer]);this.b=[];this.n=0}}return true}}
registerProcessor('cap',P);`;

async function start() {
  warn('');
  if (!window.isSecureContext || !navigator.mediaDevices) { warn(L.insecure); return; }
  $('go').disabled = true; setState(L.connecting);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  } catch (e) { $('go').disabled = false; setState(L.ready); warn(L.denied + ' (' + e.name + ')'); return; }
  try { ctx = new AudioContext({ sampleRate: RATE }); src = ctx.createMediaStreamSource(stream); }
  catch (e) { try { ctx && ctx.close(); } catch (e2) { } ctx = new AudioContext(); src = ctx.createMediaStreamSource(stream); }
  inBuf = new Float32Array(0); pos = 0;
  try {
    const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'cap');
    node.port.onmessage = e => onAudio(e.data);
    src.connect(node);
  } catch (e) {                                   // aeltere Browser
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = ev => onAudio(new Float32Array(ev.inputBuffer.getChannelData(0)));
    src.connect(node); node.connect(ctx.destination);
  }
  running = true; $('go').disabled = false; $('go').classList.add('on'); tr();
  keepAwake(); motStart();
}
function stop(keepMsg) {
  toneSet(false);
  running = false;
  try { node && node.disconnect(); src && src.disconnect(); } catch (e) { }
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) { }
  try { ctx && ctx.close(); } catch (e) { }
  motStop();
  node = src = stream = ctx = null; queue = []; acc = new Float32Array(0); inBuf = new Float32Array(0); pos = 0;
  $('go').classList.remove('on'); tr(); if (!keepMsg) setState(L.ready);
  if (wakeLock) { wakeLock.release().catch(() => { }); wakeLock = null; }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && running) { wakeLock = await navigator.wakeLock.request('screen'); $('wl').textContent = L.wlon; wakeLock.addEventListener('release', () => { wakeLock = null; }); } else if (running) $('wl').textContent = L.wloff; }
  catch (e) { $('wl').textContent = L.wloff; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) { keepAwake(); if (ctx && ctx.state !== 'running') ctx.resume(); }
  if (document.visibilityState === 'hidden' && running) warn(L.hidden);
});
$('go').addEventListener('click', () => running ? stop() : (dead ? location.reload() : start()));

// Anzeige
const lo = -100, hi = -10, X = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
setInterval(() => {
  if (!running) { $('bar').style.width = '0'; return; }
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => { });
  $('bar').style.width = X(localDb) + '%';
  $('lvl').textContent = localDb.toFixed(1) + ' dBFS';
  if (srvThr != null) { $('thr').style.display = 'block'; $('thr').style.left = X(srvThr) + '%'; $('thrv').textContent = L.thr + ' ' + srvThr.toFixed(1); }
  $('sent').textContent = (sentBytes / 1048576).toFixed(1) + ' MB ' + L.sent;
  if (MOT.vib) { $('mvv').textContent = (motOn ? lastV.toFixed(2) + ' m/s²' : '–') + (srvMot.vib ? ' · ' + L.mon : ''); $('mvv').className = srvMot.vib ? 'on' : ''; }
  if (MOT.tilt) { $('mtv').textContent = (tB ? lastT.toFixed(0) + '°' : '–') + (srvMot.tilt ? ' · ' + L.mon : ''); $('mtv').className = srvMot.tilt ? 'on' : ''; }
  if (MOT.cam) { $('mcv').textContent = (camStream ? lastC.toFixed(1) + ' %' : '–') + (srvMot.cam ? ' · ' + L.mon : ''); $('mcv').className = srvMot.cam ? 'on' : ''; }
  if (Date.now() - lastOk < 3000) {
    if (!srvEnabled) setState(L.disabled, 'err');
    else if (srvPaused) setState(L.paused, 'err');
    else if (srvHold) setState(L.hold + ' (' + srvHold + ')', 'err');
    else if (srvActive) setState(L.event, 'ev');
    else setState(srvLearning ? L.learning : L.live, 'ok');
    if (document.visibilityState === 'visible') warn('');
  } else if (lastOk) setState(L.offline, 'err');
}, 250);

tr(); info();
})();
</script>
