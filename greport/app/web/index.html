<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GReport</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="greport.css?v={{VERSION}}">
<link rel="stylesheet" href="shoelace-ui.css?v={{VERSION}}">
</head>
<body>
<div class="page">
  <header class="top">
    <img src="icon.png" alt="" class="logo" width="36" height="36">
    <div class="brand"><b data-i="title"></b><small>v{{VERSION}}</small></div>
    <span class="grow"></span>
    <span id="grstat" class="status" role="group" data-ia="gr_a_status"></span>
    <button id="helpbtn" class="icon" type="button" data-ia="gr_help">?</button>
    <button id="themebtn" class="icon" type="button"></button>
    <button id="grmenu" class="icon" type="button" data-ia="gr_menu" aria-haspopup="true">⋯</button>
    <div id="grmenul" class="menu" role="menu" hidden></div>
  </header>

  <main id="content">
  <section id="fnpanel" class="capture" aria-labelledby="capttl">
    <div class="caphead">
      <div class="clock"><time id="capclock" class="clocknum">--:--:--</time><span id="capdate" class="clockdate"></span></div>
      <div class="capinfo"><b id="capttl" data-i="fn_btn"></b><small id="fnpfrom"></small></div>
      <button type="button" id="laybtn" class="icon" data-ia="gr_lay" aria-pressed="false">▦</button>
      <button type="button" id="fnppop" class="icon" data-ia="pop_tip">⧉</button>
    </div>
    <div id="tplfirst" class="fbtplbox first" role="region" data-ia="fb_tpl_title" hidden></div>
    <div id="laybar" class="laybar" role="region" data-ia="gr_lay" hidden></div>
    <div id="fnpbody" class="capbody">
      <div id="secbar" class="secbar" role="group" data-ia="gr_sec_tip"></div>
      <div id="fnpkinds" class="fbkinds" hidden></div>
      <textarea id="fnptext" rows="2" maxlength="500" data-iph="fn_ph" data-ia="gr_a_text"></textarea>
      <div id="fnptags" class="groups"></div>
      <div class="witrow" id="secwit"><span class="witicon" aria-hidden="true">👤</span><input type="text" id="fnpwit" maxlength="200" data-iph="fn_wit" data-ia="gr_a_wit"><div id="fnpwitl" class="witlist"></div>
        <div id="fnpwitx" class="witx" hidden><select id="fnpwrole" data-ia="gr_w_role"></select><input type="text" id="fnpwcon" maxlength="120" data-iph="gr_w_con_ph" data-ia="gr_w_con"></div>
        <small id="sechwit" class="fbhelp" hidden></small>
        <div class="tipslot" data-tips="4"></div></div>
      <details class="more" id="secmore"><summary data-i="gr_more_s"></summary>
        <small id="sechmore" class="fbhelp" hidden></small>
        <div id="fbmore" class="fbmore"></div>
        <div id="moreold">
        <div class="moregrid">
          <label class="field"><span data-i="gr_x_freq"></span><input type="text" id="xfreq" maxlength="80" data-iph="gr_x_freq_ph"></label>
          <div class="field"><label class="check"><input type="checkbox" id="xpol"> <span data-i="gr_x_pol"></span></label><input type="text" id="xpolnr" maxlength="40" data-iph="gr_x_polnr" data-ia="gr_x_polnr"></div>
          <div class="field"><span id="xrepl" data-i="gr_x_rep"></span><div class="row wrap"><select id="xrepto" aria-labelledby="xrepl"></select><input type="date" id="xrepdate" data-ia="gr_x_repdate"></div></div>
          <label class="field"><span data-i="gr_x_health"></span><textarea id="xhealth" rows="2" maxlength="300" data-iph="gr_x_health_ph"></textarea></label>
          <label class="field"><span data-i="gr_x_attest"></span><input type="text" id="xattest" maxlength="200" data-iph="gr_x_attest_ph"></label>
          <label class="check"><input type="checkbox" id="xthreat"> <span data-i="gr_x_threat"></span></label>
        </div>
        </div>
        <p class="hint" data-i="gr_x_lvl_h"></p>
        <div class="tipslot" data-tips="5,6"></div>
      </details>
      <div class="timerow" id="sectime">
        <button type="button" id="fnptimebtn" class="linkbtn" aria-expanded="false"><span aria-hidden="true">🕒</span> <span id="fnptimetxt"></span></button>
        <small id="sechtime" class="fbhelp" hidden></small>
        <div id="fnpext" class="timeedit" hidden>
          <label><span data-i="per_from"></span><input type="datetime-local" id="fnpfromi" step="1"><button type="button" id="fnpfnow" class="chip" data-i="fn_now"></button></label>
          <label><span data-i="per_to"></span><input type="datetime-local" id="fnptoi" step="1"><button type="button" id="fnptnow" class="chip" data-i="fn_now"></button><button type="button" id="fnptclr" class="chip" data-ia="time_clear">✕</button></label>
          <label class="check"><input type="checkbox" id="fnprun"> <span data-i="fnp_run"></span></label>
          <label class="check"><input type="checkbox" id="fnpnotime"> <span data-i="gr_notime"></span></label>
        </div>
      </div>
    </div>
    <div class="tipslot captip" data-tips="cap"></div>
    <div id="fnpatts" class="attpend" hidden></div>
    <div class="savebar">
      <button type="button" id="fnpatt" class="icon" data-ia="gr_att_add">📎</button>
      <button type="button" id="fnpcam" class="icon" data-ia="gr_att_cam" hidden>📷</button>
      <small id="fnpmsg" class="msg" role="status" aria-live="polite"></small>
      <button type="button" id="fnpcancel" class="btn" data-i="cancel" hidden></button>
      <button type="button" id="fnpsave" class="btn primary" data-i="save"></button>
    </div>
  </section>

  <section class="log" id="logsec" aria-labelledby="logttl">
    <div class="loghead"><h2 id="logttl" data-i="gr_list"></h2><span class="grow"></span>
      <div class="seg" id="grview" role="group" data-ia="gr_view"><button type="button" data-v="tl" aria-pressed="true" data-i="gr_v_tl"></button><button type="button" data-v="tb" aria-pressed="false" data-i="gr_v_tb"></button></div>
    </div>
    <div class="logbar">
      <label class="rng"><span data-i="gr_show"></span><select id="grrange"></select></label>
      <span id="grcust" class="cust" hidden><label><span data-i="per_from"></span><input type="date" id="grfrom" data-ia="gr_r_from"></label><label><span data-i="per_to"></span><input type="date" id="grto" data-ia="gr_r_to"></label></span>
      <span class="grow"></span>
      <input type="search" id="grq" data-iph="gr_search" data-ia="gr_search">
      <span class="colwrap"><button type="button" id="grcols" class="icon" data-ia="gr_cols" aria-haspopup="true" aria-expanded="false" hidden>⚙</button><div id="grcolm" class="menu colmenu" role="group" data-ia="gr_cols" hidden></div></span>
    </div>
    <div id="grstats" class="fbstats" role="group" data-ia="fb_st_title" hidden></div>
    <div class="countrow"><small id="grcount" role="status" aria-live="polite"></small><button type="button" id="grclr" class="linkbtn" data-i="gr_clr" hidden></button></div>
    <div id="grfilt" class="filters"></div>
    <div id="grnotes" class="timeline"></div>
    <div id="grgrid" class="grid" hidden></div>
  </section>
  </main>
  <p class="foot" data-i="gr_foot"></p>
</div>

<dialog id="qtdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="qt_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p class="hint" data-i="gr_qt_ha"></p>
  <div class="qtbar">
    <div class="seg" role="radiogroup"><button type="button" data-mode="use" data-i="gr_mode_use"></button><button type="button" data-mode="fixed" data-i="gr_mode_fixed"></button></div>
    <span class="grow"></span>
    <button type="button" id="qtreset" class="btn" data-i="gr_reset"></button>
  </div>
  <div class="qtadd"><input type="text" id="qtnew" maxlength="30" data-iph="qt_new_ph" data-ia="qt_new_ph"><select id="qtnewg" data-ia="gr_a_group"></select><button type="button" id="qtaddok" class="btn primary" data-i="qt_create"></button></div>
  <small id="qtinfo" class="hint"></small>
  <div id="qtlim" class="qtlim"></div>
  <div id="qtsug" class="sug"></div>
  <div id="qtlist" class="qtlist"></div>
</dialog>

<dialog id="prefdlg" class="dlg">
  <div class="dlghead"><h3 data-i="gr_prefs"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <label class="field"><span data-i="gr_p_date"></span><select id="pfdate"></select></label>
  <label class="field"><span data-i="gr_p_time"></span><select id="pftime"></select></label>
  <label class="check"><input type="checkbox" id="pfrel"> <span data-i="gr_p_rel"></span></label>
  <label class="check"><input type="checkbox" id="pfwd"> <span data-i="gr_p_wd"></span></label>
  <label class="field"><span data-i="gr_p_tips"></span><select id="pftipmode"><option value="hover" data-i="gr_tm_hover"></option><option value="always" data-i="gr_tm_always"></option><option value="off" data-i="gr_tm_off"></option></select></label>
  <small class="hint" data-i="gr_p_tips_pop"></small>
  <button type="button" id="pftipsr" class="linkbtn" data-i="gr_p_tips_r"></button>
  <p class="hint"><span data-i="gr_p_example"></span> <b id="pfex"></b></p>
  <div class="dlgfoot"><span class="grow"></span><button type="button" class="btn dlgx" data-i="cancel"></button><button type="button" id="pfsave" class="btn primary" data-i="save"></button></div>
</dialog>

<dialog id="gldlg" class="dlg">
  <div class="dlghead"><h3 data-i="gr_gl_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <label class="check"><input type="checkbox" id="glshare"> <span data-i="gr_gl_share"></span></label>
  <p class="hint" data-i="gr_gl_share_h"></p>
  <p class="hint" id="glst"></p>
  <div class="dlgfoot"><span class="grow"></span><button type="button" class="btn dlgx" data-i="cancel"></button><button type="button" id="glsave" class="btn primary" data-i="save"></button></div>
</dialog>

<dialog id="txtdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="gr_txt_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p id="txtpro" class="hint lockline" hidden></p>
  <section class="blk">
    <h4 data-i="gr_txt_diary"></h4>
    <p class="hint" data-i="gr_txt_diary_h"></p>
    <label class="check"><input type="checkbox" id="txton"> <span data-i="gr_txt_on"></span></label>
    <label class="field"><span data-i="gr_txt_path"></span><input type="text" id="txtpath" spellcheck="false" autocomplete="off"></label>
    <div class="row wrap"><label class="field inl"><span data-i="gr_txt_fmt"></span><select id="txtfmt"><option value="txt" data-i="gr_fmt_txt"></option><option value="csv" data-i="gr_fmt_csv"></option></select></label>
      <label class="check"><input type="checkbox" id="txtmon"> <span data-i="gr_txt_monthly"></span></label></div>
    <small id="txtst" class="hint"></small>
    <div class="dlgfoot"><span class="grow"></span><button type="button" id="txtnow" class="btn" data-i="gr_txt_now"></button><button type="button" id="txtsave" class="btn primary" data-i="save"></button></div>
  </section>
  <section class="blk">
    <h4 data-i="gr_exp_title"></h4>
    <div class="tipslot" data-tips="16"></div>
    <div class="row wrap"><select id="expfmt" data-ia="gr_a_expfmt"><option value="txt" data-i="gr_fmt_txt"></option><option value="csv" data-i="gr_fmt_csv"></option><option value="json" data-i="gr_fmt_json"></option></select>
      <input type="text" id="exppath" class="grow" spellcheck="false" autocomplete="off" data-ia="gr_a_exppath"></div>
    <small id="expst" class="hint"></small>
    <div class="dlgfoot"><button type="button" id="expdl" class="btn" data-i="gr_exp_dl"></button><span class="grow"></span><button type="button" id="expgo" class="btn primary" data-i="gr_exp_go"></button></div>
  </section>
  <section class="blk">
    <h4 data-i="gr_imp_title"></h4>
    <p class="hint" data-i="gr_imp_h"></p>
    <div class="row wrap"><input type="text" id="imppath" class="grow" spellcheck="false" autocomplete="off" data-iph="gr_imp_path_ph" data-ia="gr_imp_path_ph"><button type="button" id="impfile" class="btn" data-i="gr_imp_file"></button></div>
    <div id="impres" class="impres" hidden></div>
    <div class="dlgfoot"><span class="grow"></span><button type="button" id="impprev" class="btn" data-i="gr_imp_prev"></button><button type="button" id="impgo" class="btn primary" data-i="gr_imp_go" disabled></button></div>
  </section>
</dialog>
<input type="file" id="impf" accept=".txt,.csv,.json,.log,text/plain,text/csv,application/json" hidden>

<dialog id="dashdlg" class="dlg wide" aria-labelledby="dashttl">
  <div class="dlghead"><h3 id="dashttl" data-i="gr_dash"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <div id="dashbox"></div>
</dialog>

<dialog id="verdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="gr_ver_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <div id="verbox" class="verbox" role="status" aria-live="polite"></div>
  <div class="dlgfoot"><a id="verdl" class="btn" href="nachweis" download data-i="gr_ver_dl"></a><span class="grow"></span><button type="button" id="veragain" class="btn" data-i="gr_ver_again"></button></div>
  <section class="blk"><h4 data-i="gr_rep_title"></h4><p class="hint" data-i="gr_rep_h"></p>
    <div class="row wrap"><a id="repdl" class="btn primary" href="bericht" download data-i="gr_rep_dl"></a><a id="repgs" class="btn" href="bericht?gs=1" download data-i="gr_rep_gs"></a></div>
    <div class="tipslot" data-tips="16"></div></section>
  <section class="blk"><h4 data-i="gr_trash"></h4><p class="hint" data-i="gr_trash_h"></p><div id="trashbox" class="histlist"></div></section>
</dialog>

<dialog id="histdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="gr_hist_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <div class="tipslot" data-tips="8"></div>
  <div id="histbox" class="histlist"></div>
</dialog>

<dialog id="helpdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="gr_help"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <div id="helpbody" class="help"></div>
</dialog>

<dialog id="prodlg" class="dlg">
  <div class="dlghead"><h3>⭐ <span data-i="pro_title"></span></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p id="prost"></p>
  <p class="hint" data-i="gr_pro_list"></p>
  <div class="row"><input type="text" id="prokey" placeholder="GL1-…" autocomplete="off" spellcheck="false" data-ia="gr_a_prokey"><button type="button" id="prosave" class="btn primary" data-i="pro_activate"></button></div>
  <p id="promsg" class="msg" role="status" aria-live="polite"></p>
  <div class="dlgfoot"><a id="probuy" class="btn" target="_blank" rel="noopener" data-i="pro_buy"></a><button type="button" id="prodel" class="btn" data-i="pro_remove" hidden></button></div>
</dialog>

<dialog id="perdlg" class="dlg">
  <div class="dlghead"><h3 data-i="gr_persons"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p class="hint" data-i="gr_persons_h"></p>
  <textarea id="perlist" rows="6" data-ia="gr_persons"></textarea>
  <div class="dlgfoot"><span class="grow"></span><button type="button" class="btn dlgx" data-i="cancel"></button><button type="button" id="persave" class="btn primary" data-i="save"></button></div>
</dialog>
<input type="file" id="grimpf" accept=".json,application/json" hidden>
<input type="file" id="attf" multiple accept=".txt,.pdf,.jpg,.jpeg,.png,.heic,.heif,.docx,.odt,.eml,text/plain,application/pdf,image/jpeg,image/png,image/heic,message/rfc822" hidden>
<input type="file" id="attcam" accept="image/*" capture="environment" hidden>

<dialog id="attdlg" class="dlg wide">
  <div class="dlghead"><h3 data-i="gr_att_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p class="hint" data-i="gr_att_h"></p>
  <div class="row wrap"><button type="button" id="attup" class="btn primary" data-i="gr_att_up"></button><button type="button" id="attupcam" class="btn" data-i="gr_att_cam" hidden></button><span class="grow"></span><small id="attuse" class="hint"></small></div>
  <p id="attfor" class="hint" hidden></p>
  <small id="attmsg" class="msg" role="status" aria-live="polite"></small>
  <div id="attlist" class="histlist"></div>
  <details class="blk" id="atttr"><summary data-i="gr_att_trash"></summary><div id="atttrash" class="histlist"></div></details>
  <p class="hint" id="atttools"></p>
</dialog>

<dialog id="prevdlg" class="dlg wide" aria-labelledby="prevttl">
  <div class="dlghead"><h3 id="prevttl"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <div id="prevbox" class="prevbox"></div>
  <p class="hint" id="previnfo"></p>
  <div class="dlgfoot"><a id="prevdl" class="btn" download data-i="gr_att_dl"></a><a id="prevtxt" class="btn" download data-i="gr_att_txt" hidden></a><span class="grow"></span></div>
</dialog>

<dialog id="docdlg" class="dlg wide xwide" aria-labelledby="docttl">
  <div class="dlghead"><h3 id="docttl" data-i="gr_doc_title"></h3><button type="button" class="icon dlgx" data-ia="close">✕</button></div>
  <p class="hint" id="docinfo"></p>
  <div id="docst" class="msg" role="status" aria-live="polite"></div>
  <div class="row wrap" id="docbar" hidden><button type="button" id="docall" class="btn" data-i="gr_doc_all"></button><button type="button" id="docnone" class="btn" data-i="gr_doc_nosel"></button><span class="grow"></span><small id="doccnt" class="hint"></small></div>
  <div id="doclist" class="doclist"></div>
  <div class="dlgfoot"><button type="button" id="docagain" class="btn" data-i="gr_doc_again" hidden></button><span class="grow"></span><button type="button" class="btn dlgx" data-i="cancel"></button><button type="button" id="docgo" class="btn primary" data-i="gr_doc_go" disabled></button></div>
</dialog>
<script src="i18n.js?v={{VERSION}}"></script>
<script src="hadash-ui.js?v={{VERSION}}"></script>
<script src="ag-grid-community.min.js?v={{VERSION}}"></script>
<script src="shoelace-ui.js?v={{VERSION}}"></script>
<script src="felder.js?v={{VERSION}}"></script>
<script src="app.js?v={{VERSION}}"></script>
</body>
</html>
