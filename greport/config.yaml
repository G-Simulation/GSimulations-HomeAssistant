name: "GReport"
version: "1.12.10"
slug: greport
description: "Notizen zu Störungen festhalten – mit Schnellwahl, Zeugen und Logbuch in Home Assistant; arbeitet mit GLighter zusammen / Record notes about disturbances – quick select, witnesses, Home Assistant logbook; works with GLighter"
url: "https://www.gsimulations.de/greport/"
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
watchdog: "tcp://[HOST]:[PORT:8099]"
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:note-edit-outline
panel_title: "GReport"
services:
  - mqtt:want
map:
  - share:rw
  - homeassistant_config:rw
options:
  language: "auto"
  mqtt: true
  logbook: true
  output_dir: "/share/greport"
  attach_max_mb: 25
  attach_total_mb: 500
schema:
  language: list(auto|de|en)?
  mqtt: bool
  logbook: bool
  output_dir: str
  attach_max_mb: int(1,500)?
  attach_total_mb: int(10,100000)?
